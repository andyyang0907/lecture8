<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园三维 · 校园信息中心</title>

  <link href="../libs/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <script src="../libs/aframe.min.js"></script>

  <style>
    body { margin: 0; }
  </style>
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-md navbar-dark bg-dark" style="position: absolute; top: 0; left: 0; right: 0; z-index: 10;">
    <div class="container">
      <a class="navbar-brand" href="../index.html">校园信息中心</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#nav"
              aria-controls="nav" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="../study-rooms.html">自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="../stats.html">统计</a></li>
          <li class="nav-item"><a class="nav-link active" href="scene.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <a-scene background="color: #aee3f7">
    <a-plane position="0 0 -4" rotation="-90 0 0"
             width="20" height="20" color="#7cb342"></a-plane>
    <a-box position="0 1 -3" width="2" height="2" depth="2" color="#efeeee"></a-box>
    <a-box position="0 2.3 -3" width="2.2" height="0.3" depth="2.2" color="#b71c1c"></a-box>
    <a-cylinder position="2 1.5 -3" radius="0.05" height="3" color="#9e9e9e"></a-cylinder>
    <a-box position="2.25 2.7 -3" width="0.5" height="0.3" depth="0.03" color="#e53935"
           animation="property: position; to: 2.3 2.7 -3; dir: alternate; dur: 900; loop: true"></a-box>
    <a-cylinder position="-2 1 -3" radius="0.06" height="2" color="#616161"></a-cylinder>
    <a-sphere position="-2 2.2 -3" radius="0.15" color="#fff59d"
              animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; dur: 1200; loop: true"></a-sphere>
    <a-light type="point" position="-2 2.3 -4" color="#fff59d" intensity="0.6"></a-light>
    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
  </a-scene>

  <script src="../libs/jquery-3.7.1.min.js"></script>
  <script src="../libs/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>

</body>
</html>
