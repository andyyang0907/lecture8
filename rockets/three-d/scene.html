<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>火箭结构 · 三维</title>

  <link href="../libs/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <script src="../libs/aframe.min.js"></script>

  <style>
    body { margin: 0; }
  </style>
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-md navbar-dark bg-dark" style="position: absolute; top: 0; left: 0; right: 0; z-index: 10;">
    <div class="container">
      <a class="navbar-brand" href="../index.html">火箭家族</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#nav"
              aria-controls="nav" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">家族</a></li>
          <li class="nav-item"><a class="nav-link" href="../timeline.html">发展史</a></li>
          <li class="nav-item"><a class="nav-link active" href="scene.html">结构三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <a-scene background="color: #0a1a2f">

    <a-plane position="0 0 -5" rotation="-90 0 0"
             width="20" height="20" color="#1e2a3a"></a-plane>

    <!-- 鼻锥：圆锥 -->
    <a-cone position="0 4.5 -5"
            radius-bottom="0.3" radius-top="0" height="1"
            color="#fafafa"></a-cone>

    <!-- 箭体：圆柱 -->
    <a-cylinder position="0 2.5 -5" radius="0.3" height="3"
                color="#ffffff"></a-cylinder>

    <!-- 喷嘴：翻转的圆锥 -->
    <a-cone position="0 0.6 -5"
            rotation="180 0 0"
            radius-top="0.3" radius-bottom="0.15" height="0.5"
            color="#333333"></a-cone>

    <!-- 火焰：翻转的圆锥，带动画 -->
    <a-cone position="0 -0.3 -5"
            rotation="180 0 0"
            radius-top="0.2" radius-bottom="0" height="0.9"
            color="#ff5722"
            material="opacity: 0.85; emissive: #ff5722; emissiveIntensity: 0.6"
            animation="property: scale; to: 1 1.2 1; dir: alternate; dur: 200; loop: true"></a-cone>

    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
    <a-light type="point" position="2 4 -3" color="#fff59d" intensity="0.5"></a-light>

    <a-camera position="0 2.5 4"></a-camera>

  </a-scene>

  <script src="../libs/jquery-3.7.1.min.js"></script>
  <script src="../libs/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>

</body>
</html>
